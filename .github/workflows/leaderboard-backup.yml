name: Leaderboard backup

# Every 30 minutes: back up the live scores into leaderboard.json and repair the store if it was wiped.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leaderboard-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync scores
        run: |
          if [ ! -s leaderboard-config.json ]; then echo "Run the 'Leaderboard setup' workflow first."; exit 0; fi
          node .github/scripts/sync-board.js
      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboard.json
          git diff --cached --quiet && exit 0
          git commit -m "Back up leaderboard"
          git push
